<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>Bazaar — Buy & Sell Anything</title>
    <meta name="description" content="Bazaar is a modern classified ads marketplace. Browse thousands of listings from trusted sellers and find great deals." />
    <link rel="canonical" href="https://bazaar.example.com" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bazaar.example.com" />
    <meta property="og:title" content="Bazaar — Buy & Sell Anything" />
    <meta property="og:description" content="Modern classified ads marketplace. Browse listings, connect with trusted sellers." />
    <meta property="og:image" content="https://bazaar.example.com/og-image.png" />

    <!-- Twitter/X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bazaar — Buy & Sell Anything" />
    <meta name="twitter:description" content="Modern classified ads marketplace. Browse listings, connect with trusted sellers." />
    <meta name="twitter:image" content="https://bazaar.example.com/og-image.png" />

    <!-- Schema.org WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Bazaar",
      "url": "https://bazaar.example.com",
      "description": "Modern classified ads marketplace",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://bazaar.example.com/listings?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
