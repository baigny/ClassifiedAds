# ─────────────────────────────────────────────
#  Bazaar — WhatsApp Bot Stack
#
#  WAHA  : self-hosted WhatsApp HTTP API (port 3000)
#  n8n   : workflow automation engine   (port 5678)
#
#  Both containers share the "bot_net" network so:
#   • WAHA POSTs webhook events  →  http://n8n:5678/webhook/waha-listener
#   • n8n  sends replies         →  http://waha:3000/api/sendText
#
#  Quick start:
#    docker compose up -d
#    http://localhost:3000          → WAHA dashboard (scan QR here)
#    http://localhost:5678          → n8n UI (import workflow.json here)
# ─────────────────────────────────────────────

services:

  # ── WhatsApp HTTP API ──────────────────────
  waha:
    image: devlikeapro/waha:latest
    container_name: bazaar_waha
    restart: unless-stopped
    env_file:
      - .env               # generated by: docker run --rm -v "%cd%":/app/env devlikeapro/waha init-waha /app/env
    environment:
      # Where WAHA sends incoming message events (overrides anything in .env)
      WHATSAPP_HOOK_URL: http://n8n:5678/webhook/waha-listener
      WHATSAPP_HOOK_EVENTS: message
    ports:
      - "3000:3000"    # WAHA dashboard + REST API
    volumes:
      - waha_sessions:/app/.waha/sessions   # persists QR scan across restarts
    networks:
      - bot_net

  # ── n8n Workflow Engine ────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: bazaar_n8n
    restart: unless-stopped
    environment:
      N8N_HOST: 0.0.0.0
      N8N_PORT: "5678"
      # Used by n8n to generate webhook URLs shown in the UI
      # Change to your public domain when deploying to a server
      WEBHOOK_URL: http://localhost:5678
      # Disable user management — bypasses all permission checks for local use
      N8N_USER_MANAGEMENT_DISABLED: "true"
      # Disable email-based features that require SMTP
      N8N_EMAIL_MODE: ""
      # Enable debug logging and save all executions for troubleshooting
      N8N_LOG_LEVEL: debug
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
    ports:
      - "5678:5678"    # n8n dashboard
    volumes:
      - n8n_data:/home/node/.n8n    # persists workflows, credentials, executions
    networks:
      - bot_net
    depends_on:
      - waha

# ── Persistent volumes ─────────────────────────
volumes:
  waha_sessions:
  n8n_data:

# ── Shared network ─────────────────────────────
networks:
  bot_net:
    driver: bridge
